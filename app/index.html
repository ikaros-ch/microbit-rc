<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#181a21">
<title>micro:bit RC Pad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <button id="connect" class="primary">Connect</button>
  <span id="dot" class="dot" title="Bluetooth"></span>
  <span id="devname">Not connected</span>
  <span id="tx" class="mono"></span>
  <span class="grow"></span>
  <span id="edittools" hidden>
    <select id="add" data-i18n-title="add">
      <option value="" data-i18n="add">+ Add…</option>
      <option value="button" data-i18n="button">Button</option>
      <option value="toggle" data-i18n="toggle">Toggle switch</option>
      <option value="slider" data-i18n="slider">Slider (linear pot)</option>
      <option value="joystick" data-i18n="joystick">Joystick</option>
      <option value="display" data-i18n="display">Display</option>
    </select>
    <button id="export" data-i18n="export">Export</button>
    <label class="btn"><span data-i18n="import">Import</span><input id="import" type="file" accept=".json,application/json" hidden></label>
    <button id="reset" data-i18n="reset">Reset</button>
  </span>
  <button id="edit">Edit</button>
  <select id="lang" aria-label="Language">
    <option value="en">EN</option>
    <option value="el">ΕΛ</option>
  </select>
  <button id="fs" data-i18n-title="fullscreen">⛶</button>
</header>
<main id="stage"></main>
<aside id="panel" hidden></aside>
<script type="module" src="app.js"></script>
</body>
</html>
