name: apk
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Keystore
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, signing with a debug key"
          fi
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          VERSION="${{ github.event.release.tag_name || 'dev' }}"
          gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName="${VERSION#v}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/rc-pad.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: rc-pad-apk
          path: rc-pad.apk
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" rc-pad.apk --clobber
